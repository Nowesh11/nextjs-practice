# name of the workflow
name: CI

# when to run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# what to do
jobs:
  test:
    # run on Ubuntu
    runs-on: ubuntu-latest

    steps:
      # Step 1 - get your code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 - setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3 - install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4 - run tests
      - name: Run tests
        run: npm test

      # Step 5 - build app
      - name: Build
        run: npm run build